# Staging. Production gets its own services from `release` (design.md 1.3).

databases:
  - name: pr-pulse-staging-db
    plan: free

services:
  - type: web
    name: pr-pulse-staging
    runtime: node
    plan: free
    branch: render-test
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pr-pulse-staging-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: TOKEN_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false

